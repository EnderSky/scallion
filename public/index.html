<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scallion | Chopped</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css?v=38">
</head>
<body>
  <!-- Global Toast Container for Lobby/Waiting alerts -->
  <div id="global-toast-container"></div>

  <div id="app">
    <!-- VIEW 1: LOBBY -->
    <div id="view-lobby" class="view">
      <div class="card">
        <h1 class="main-title">SCALLION</h1>
        <p class="subtitle">Answer before you're chopped!</p>
        
        <div class="input-group">
          <label>Nickname</label>
          <input type="text" id="lobby-nickname" placeholder="Enter name..." maxlength="15">
        </div>

        <div class="lobby-options">
          <div class="option-box">
            <h3>Create Room</h3>
            <div id="category-pills" class="category-pills"></div>
            <button id="btn-create">Create</button>
          </div>
          
          <div class="divider">OR</div>

          <div class="option-box">
            <h3>Join Room</h3>
            <input type="text" id="lobby-room-code" placeholder="XXXX" maxlength="4">
            <button id="btn-join">Join</button>
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW 2: WAITING ROOM -->
    <div id="waiting-screen" class="view hidden">
      <div class="waiting-room-card">
        <!-- Middle: 3x3 Arena Simulation -->
        <div id="waiting-arena-stage" class="arena-stage waiting-arena-stage">
          <div class="chopping-block waiting-board">
            <div id="waiting-winner-banner" class="waiting-winner-banner hidden"></div>
            <div id="waiting-room-meta">
              <div id="waiting-code" class="room-code-badge" title="Click to copy">----</div>
              <div class="waiting-meta">
                <span class="waiting-category-pill" id="waiting-category">All Categories</span>
                <span class="waiting-player-count" id="waiting-player-count">0 / 6</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom Bar: Host Controls -->
        <div class="waiting-bottom-bar">
          <div class="waiting-host-controls">
            <button id="btn-start" class="hidden">Start Game</button>
            <button id="btn-leave-room">Leave Room</button>
          </div>
          <div class="waiting-host-message hidden" id="waiting-host-message">Waiting for host to start...</div>
        </div>
      </div>
    </div>

    <!-- VIEW 3: GAME ARENA -->
    <div id="view-game" class="view hidden">
      <div class="game-layout">
        <!-- Top Section: Prompts & Timer (sticky when mobile keyboard opens) -->
        <div class="arena-top-sticky">
          <div id="prompt-banner" class="prompt-banner">
            Loading prompt...
          </div>
          
          <div id="timer-bar-container" class="timer-bar-container">
            <div id="timer-bar-fill" class="timer-bar-fill"></div>
          </div>
   
          <div id="recent-answers" class="recent-answers"></div>
        </div>

        <!-- Middle Section: The Stage -->
        <div id="game-arena-stage" class="arena-stage">
          <div id="player-ring" class="player-ring"></div>
          
          <div class="chopping-block">
            <!-- Poised Cleaver -->
            <div id="center-cleaver" class="hover-cleaver">
              <svg width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 10 L60 10 L60 45 L10 45 Z" fill="#ddd" stroke="#160d08" stroke-width="3" />
                <path d="M10 40 L60 40" stroke="#aaa" stroke-width="1" />
                <circle cx="18" cy="27" r="4" fill="#160d08" />
                <rect x="60" y="20" width="15" height="20" rx="2" fill="#5d4037" stroke="#160d08" stroke-width="3" />
              </svg>
            </div>
            <!-- Scallion and Name Group -->
            <div class="chopping-contents">
              <div id="center-scallion" class="center-scallion"></div>
              <div id="center-player-name" class="center-player-name"></div>
            </div>
          </div>

          <!-- Bottom-Right Grid Cell: Event Log -->
          <div id="event-log" class="event-log"></div>
        </div>

        <!-- Lower-Middle: Status and Input (sticky when mobile keyboard opens) -->
        <div class="arena-bottom-sticky">
          <div id="turn-indicator">Wait your turn...</div>
          
          <div id="local-player-slot"></div>
          
          <div class="input-area">
            <form id="answer-form">
              <input type="text" id="answer-input" placeholder="Type answer here..." autocomplete="off">
              <button type="submit" id="send-btn">Send</button>
            </form>
          </div>
        </div>

        <div class="activity-feed" id="activity-feed"></div>
      </div>
    </div>
  </div>

  <!-- Full-Width Centered Intermission Overlay -->
  <div id="intermission-banner" class="intermission-banner hidden">
    <div class="intermission-pill">
      <h2 id="intermission-text">NEW PROMPT INCOMING...</h2>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js?v=38"></script>
</body>
</html>
